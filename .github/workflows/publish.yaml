# Publishes server.json to the MCP Registry as io.kooga/kooga when it changes
# on main. The Registry checks Kooga owns kooga.io against the public key at
# https://kooga.io/.well-known/mcp-registry-auth; the private key is the
# repository secret MCP_PUBLISH_KEY, the PEM file base64-encoded. A version
# can be published once: bump `version` with every change.
name: Publish to MCP Registry

on:
  push:
    branches:
      - main
    paths:
      - 'server.json'
  workflow_dispatch:

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
      MCP_PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        shell: bash
        run: |
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          chmod +x "$RUNNER_TEMP/mcp-publisher"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate server.json
        run: mcp-publisher validate server.json

      - name: Sign in to the MCP Registry as kooga.io
        shell: bash
        env:
          MCP_PUBLISH_KEY: ${{ secrets.MCP_PUBLISH_KEY }}
        run: |
          : "${MCP_PUBLISH_KEY:?MCP_PUBLISH_KEY is not set}"
          umask 077
          key_path="$(mktemp "$RUNNER_TEMP/mcp-registry-key.XXXXXX")"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$MCP_PUBLISH_KEY" | base64 --decode > "$key_path"
          private_key_hex="$(openssl pkey -in "$key_path" -text -noout | sed -n '/^priv:/,/^pub:/p' | sed '/^priv:/d; /^pub:/d' | tr -d ' :\n')"
          [[ "$private_key_hex" =~ ^[[:xdigit:]]{64}$ ]]
          printf '::add-mask::%s\n' "$private_key_hex"
          mcp-publisher login http --domain kooga.io --private-key "$private_key_hex"

      - name: Publish
        run: mcp-publisher publish server.json
